<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>byte-cart — terminal</title>
  <style>
    :root {
      --bg:       #080c0a;
      --surface:  #0e1410;
      --text:     #c8d8c2;
      --muted:    #4a6050;
      --accent:   #5a9e70;
      --blue:     #6b9bd1;
      --amber:    #c8a050;
      --dim:      #2a3a2e;
      --prompt:   #4ec87c;
      --err:      #c86060;
      --border:   #1e2e22;
      --scanline: rgba(0,0,0,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', 'Menlo', 'Consolas', 'DejaVu Sans Mono', monospace;
      font-size: 14px;
      line-height: 1.7;
      overflow: hidden;
    }

    /* CRT scanlines overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        var(--scanline) 2px,
        var(--scanline) 4px
      );
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* Phosphor vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 60%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 99;
    }

    #screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    /* Title bar */
    #titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #c84040; }
    .dot-y { background: #c8a040; }
    .dot-g { background: #40a860; }

    #titlebar-label {
      margin-left: auto;
      margin-right: auto;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    /* Output area */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--dim) transparent;
    }

    #output::-webkit-scrollbar { width: 4px; }
    #output::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    /* Input row */
    #input-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 8px 24px 20px;
      flex-shrink: 0;
    }

    #prompt-label {
      color: var(--prompt);
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 500;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      caret-color: var(--prompt);
      padding: 0 0 0 4px;
    }

    /* Output elements */
    .line { display: block; white-space: pre-wrap; word-break: break-word; }
    .line-cmd { color: var(--text); }
    .line-cmd .user-prompt { color: var(--prompt); }
    .line-blank { display: block; height: 1em; }

    .c-accent { color: var(--accent); }
    .c-blue   { color: var(--blue); }
    .c-amber  { color: var(--amber); }
    .c-muted  { color: var(--muted); }
    .c-err    { color: var(--err); }
    .c-dim    { color: var(--dim); }
    .c-white  { color: #e0e0e0; }
    .c-text   { color: var(--text); }
    .c-prompt { color: var(--prompt); }
    .bold     { font-weight: 700; }
    .italic   { font-style: italic; }

    /* ASCII art / banner */
    .banner {
      color: var(--accent);
      font-size: 12px;
      line-height: 1.3;
      letter-spacing: 0.02em;
      display: block;
      white-space: pre;
    }

    .banner-sm {
      color: var(--accent);
      font-size: 11px;
      line-height: 1.3;
      letter-spacing: 0.01em;
      display: block;
      white-space: pre;
    }

    /* Mobile */
    @media (max-width: 639px) {
      html, body { font-size: 12px; }

      #titlebar { padding: 6px 12px; }
      #titlebar-label { font-size: 11px; }

      #output { padding: 12px 12px 6px; }

      #input-row { padding: 6px 12px 14px; }

      /* Prevent mobile browser zoom on input focus */
      #input { font-size: 16px; }

      /* Stack rows wrap gracefully on narrow screens */
      .line { white-space: pre-wrap; word-break: break-all; }

      /* Glitch is too heavy on low-powered mobile - disable */
      .banner, .banner-sm { animation: none; }
    }

    /* Blink cursor for boot */
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .blink { animation: blink 1s step-start infinite; }

    /* Fade in */
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    .fadein { animation: fadein 0.12s ease forwards; }

    /* Glitch effect on banner */
    @keyframes glitch {
      0%,100%{clip-path:none;transform:none}
      92%{clip-path:polygon(0 30%,100% 30%,100% 32%,0 32%);transform:translateX(2px)}
      94%{clip-path:polygon(0 70%,100% 70%,100% 72%,0 72%);transform:translateX(-2px)}
      96%{clip-path:none;transform:translateX(1px)}
      98%{clip-path:none;transform:none}
    }
    .banner { animation: glitch 8s ease-in-out infinite; }

    a.terminal-link {
      color: var(--blue);
      text-decoration: none;
    }
    a.terminal-link:hover { text-decoration: underline; color: #8fbaec; }
  </style>
</head>
<body>

<div id="screen">
  <div id="titlebar">
    <div class="dot dot-r"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-g"></div>
    <span id="titlebar-label">byte-cart@localhost — bash — 80×24</span>
  </div>

  <div id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>

  <div id="input-row">
    <span id="prompt-label">byte-cart@localhost:~$&nbsp;</span>
    <input id="input" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
           aria-label="Terminal input" placeholder="type 'help' to begin…">
  </div>
</div>

<script>
const out = document.getElementById('output');
const inp = document.getElementById('input');

// Focus input on click anywhere
document.addEventListener('click', () => inp.focus());

// Command history
let cmdHistory = [], histIdx = -1;

// ─── Output helpers ────────────────────────────────────────────────

function span(cls, text) {
  return `<span class="${cls}">${text}</span>`;
}

function appendLine(html = '', extraClass = '') {
  const el = document.createElement('span');
  el.className = `line fadein ${extraClass}`.trim();
  el.innerHTML = html;
  out.appendChild(el);
  out.scrollTop = out.scrollHeight;
}

function appendBlank() {
  const el = document.createElement('span');
  el.className = 'line-blank';
  out.appendChild(el);
}

function echoCmd(cmd) {
  const p = `<span class="c-prompt bold">byte-cart@localhost:~$</span> <span class="c-white">${escHtml(cmd)}</span>`;
  appendLine(p, 'line-cmd');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Boot sequence ─────────────────────────────────────────────────

const BOOT = [
  [0,   () => appendLine(`<span class="c-muted">BIOS v2.1.0 — initialising…</span>`)],
  [300, () => appendLine(`<span class="c-muted">Loading kernel…              <span class="c-accent">OK</span></span>`)],
  [600, () => appendLine(`<span class="c-muted">Mounting filesystems…        <span class="c-accent">OK</span></span>`)],
  [900, () => appendLine(`<span class="c-muted">Enabling firewall rules…     <span class="c-accent">OK</span></span>`)],
  [1200,() => appendLine(`<span class="c-muted">Starting DNS resolver…       <span class="c-accent">OK</span></span>`)],
  [1500,() => appendLine(`<span class="c-muted">Verifying integrity…         <span class="c-accent">OK</span></span>`)],
  [1900,() => appendBlank()],
  [2000,() => {
    const isMobile = window.innerWidth < 640;
    appendLine(`<span class="${isMobile ? 'banner-sm' : 'banner'}">${isMobile ? BANNER_SM : BANNER}</span>`);
  }],
  [2100,() => appendBlank()],
  [2200,() => appendLine(`${span('c-muted','Last login:')} ${span('c-accent', new Date().toDateString())} via tty0`)],
  [2300,() => appendLine(`${span('c-muted','Type')} ${span('c-amber bold','help')} ${span('c-muted','to see available commands.')}`)],
  [2400,() => appendBlank()],
  [2500,() => { inp.disabled = false; inp.focus(); }],
];

const BANNER = `
 ██████╗ ██╗   ██╗████████╗███████╗      ██████╗ █████╗ ██████╗ ████████╗
 ██╔══██╗╚██╗ ██╔╝╚══██╔══╝██╔════╝     ██╔════╝██╔══██╗██╔══██╗╚══██╔══╝
 ██████╔╝ ╚████╔╝    ██║   █████╗       ██║     ███████║██████╔╝   ██║   
 ██╔══██╗  ╚██╔╝     ██║   ██╔══╝       ██║     ██╔══██║██╔══██╗   ██║   
 ██████╔╝   ██║      ██║   ███████╗     ╚██████╗██║  ██║██║  ██║   ██║   
 ╚═════╝    ╚═╝      ╚═╝   ╚══════╝      ╚═════╝╚═╝  ╚═╝╚═╝  ╚═╝   ╚═╝  `.trim();

const BANNER_SM = `
 ██████╗ ██╗   ██╗████████╗███████╗
 ██╔══██╗╚██╗ ██╔╝╚══██╔══╝██╔════╝
 ██████╔╝ ╚████╔╝    ██║   █████╗  
 ██╔══██╗  ╚██╔╝     ██║   ██╔══╝  
 ██████╔╝   ██║      ██║   ███████╗
 ╚═════╝    ╚═╝      ╚═╝   ╚══════╝  ${span('c-muted','// byte-cart')}`.trim();

inp.disabled = true;
BOOT.forEach(([t, fn]) => setTimeout(fn, t));

// ─── Command definitions ────────────────────────────────────────────

const CMDS = {

  help() {
    appendBlank();
    appendLine(`${span('c-amber bold','Available commands:')}`);
    appendBlank();
    const cmds = [
      ['whoami',    'Identity and background'],
      ['skills',    'Technical skill set'],
      ['projects',  'Current and past projects'],
      ['stack',     'Hardware & OS setup'],
      ['privacy',   'Why privacy matters'],
      ['contact',   'Ways to reach me'],
      ['clear',     'Clear terminal output'],
      ['ls',        'List available files'],
      ['cat',       'Read a file (e.g. cat README.md)'],
    ];
    cmds.forEach(([c, d]) => {
      appendLine(`  ${span('c-accent bold', c.padEnd(14))}${span('c-muted', d)}`);
    });
    appendBlank();
  },

  whoami() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// whoami')}`);
    appendLine(`${span('c-muted', '─'.repeat(52))}`);
    appendLine(`  Handle    ${span('c-white', 'byte-cart')}`);
    appendLine(`  Role      ${span('c-white', 'Cybersecurity Infrastructure Engineer')}`);
    appendLine(`  Focus     ${span('c-white', 'Privacy-first systems, threat analysis, secure comms')}`);
    appendLine(`  OS        ${span('c-accent', 'Bazzite Atlas')} ${span('c-muted', '·')} ${span('c-accent', 'Tails')} ${span('c-muted', '·')} ${span('c-accent', 'Win11')} ${span('c-muted', '(desktop)')}  ${span('c-accent', 'GrapheneOS')} ${span('c-muted', '(mobile)')}`);
    appendLine(`  Location  ${span('c-muted', '[REDACTED]')}`);
    appendBlank();
    appendLine(`  I build and maintain privacy-focused infrastructure — recursive`);
    appendLine(`  DNS, network-level blocking, hardened mobile environments, and`);
    appendLine(`  self-hosted services that eliminate unnecessary data exposure.`);
    appendBlank();
    appendLine(`  Operates on a threat-model-first principle: the right tool for`);
    appendLine(`  each threat surface. Self-hosted where possible, audited open-`);
    appendLine(`  source where not. No telemetry. No unnecessary attack surface.`);
    appendBlank();
    appendLine(`  ${span('c-muted', '"Minimal footprint. Maximum control."')}`);
    appendBlank();
  },

  skills() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// skills')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();

    const domains = [
      {
        category: 'DNS & Network Architecture',
        desc: 'Recursive resolution with full DNSSEC validation chain. ' +
              'Authoritative local zones, split-horizon DNS, RPZ (response ' +
              'policy zones), and upstream-free resolver operation. Understands ' +
              'DNS-over-HTTPS and DNS-over-TLS threat surfaces — and why ' +
              'encrypted-but-centralised DNS is not a privacy win.',
        tools: ['Unbound', 'Pi-Hole', 'DNSSEC', 'RPZ', 'DoH/DoT analysis', 'nftables'],
      },
      {
        category: 'Network Forensics & Packet Analysis',
        desc: 'Full packet capture analysis, TCP stream reconstruction, ' +
              'protocol dissection, and traffic anomaly detection at the ' +
              'wire level. Identifies C2 beaconing patterns, DNS tunnelling, ' +
              'and covert channel exfiltration from raw PCAPs without tooling ' +
              'guardrails. Writes custom BPF filters for targeted capture.',
        tools: ['Wireshark', 'tcpdump', 'tshark', 'BPF/eBPF', 'Zeek', 'Suricata'],
      },
      {
        category: 'Threat Modelling & Attack Surface Analysis',
        desc: 'Systematic threat modelling using STRIDE and PASTA methodologies. ' +
              'Maps adversary TTPs against real infrastructure, identifies trust ' +
              'boundaries, and reduces attack surface by eliminating unnecessary ' +
              'services rather than patching around them. Thinks in attacker ' +
              'primitives: persistence, lateral movement, exfiltration.',
        tools: ['STRIDE', 'PASTA', 'MITRE ATT&CK', 'kill chain mapping'],
      },
      {
        category: 'Hardened Linux & Kernel Security',
        desc: 'Immutable, SELinux-enforcing systems as daily driver. Kernel ' +
              'parameter hardening via sysctl (ASLR, ptrace scope, kptr ' +
              'restrict), mandatory access control policy writing, seccomp ' +
              'profile creation, and namespaced container isolation without ' +
              'trusting the container runtime. Follows kernel security ' +
              'advisories and CVE disclosures closely.',
        tools: ['SELinux', 'seccomp', 'sysctl', 'Bazzite', 'rpm-ostree', 'cgroups v2'],
      },
      {
        category: 'Mobile OPSEC & Platform Security',
        desc: 'GrapheneOS in production — not as a hobby. Per-app network ' +
              'isolation, hardened WebView, no GMS, hardware-backed ' +
              'attestation, and verified boot re-locked with GrapheneOS ' +
              'signing keys. Familiar ' +
              'with the Android security model at the permission and IPC level — ' +
              'Binder, intents, and the attack surface they create.',
        tools: ['GrapheneOS', 'Vanadium', 'AVB', 'Android Binder', 'ADB forensics'],
      },
      {
        category: 'OSINT & Adversarial Reconnaissance',
        desc: 'Passive and semi-active reconnaissance: certificate transparency ' +
              'log analysis, ASN and BGP route enumeration, metadata stripping ' +
              'and analysis, and infrastructure fingerprinting. Also applies ' +
              'offensively — routinely audits own digital footprint against ' +
              'the same techniques an adversary would use.',
        tools: ['Shodan', 'crt.sh', 'WHOIS/RDAP', 'ExifTool', 'theHarvester', 'OSINT Framework'],
      },
      {
        category: 'Cryptography & Secure Comms',
        desc: 'Applied cryptography: understands the distinction between ' +
              'encryption, authentication, and forward secrecy — and which ' +
              'protocols actually deliver them. Evaluates communication tools ' +
              'against their cryptographic primitives and metadata exposure, ' +
              'not their marketing. Operates zero-identifier communications ' +
              'infrastructure in daily use.',
        tools: ['Signal Protocol', 'X3DH', 'Double Ratchet', 'WireGuard', 'SimpleX', 'GPG'],
      },
      {
        category: 'Infrastructure Hardening & Zero Trust',
        desc: 'Designs systems assuming breach. Network micro-segmentation, ' +
              'deny-by-default firewall policy (nftables), service isolation ' +
              'via systemd sandboxing directives, and principle of least ' +
              'privilege enforced at every layer. No implicit trust between ' +
              'internal services.',
        tools: ['nftables', 'systemd sandbox', 'WireGuard', 'fail2ban', 'SELinux'],
      },
      {
        category: 'Scripting, Tooling & Automation',
        desc: 'Bash for system automation and operational glue. Python for ' +
              'log parsing, data processing, and bespoke security ' +
              'tooling. Comfortable with one-liners that most people would ' +
              'write a script for, and scripts that most people would buy ' +
              'a product for.',
        tools: ['Bash', 'Python', 'awk', 'sed', 'jq', 'systemd timers', 'cron'],
      },
    ];

    domains.forEach(d => {
      appendLine(`  ${span('c-amber bold', d.category)}`);
      appendLine(span('c-muted', '  ' + '·'.repeat(48)));
      const words = d.desc.split(' ');
      let line = '  ';
      words.forEach(w => {
        if ((line + w).length > 66) {
          appendLine(span('c-text', line));
          line = '  ' + w + ' ';
        } else {
          line += w + ' ';
        }
      });
      if (line.trim()) appendLine(span('c-text', line));
      appendBlank();
      const toolStr = d.tools.map(t => span('c-accent', t)).join(span('c-muted', ' · '));
      appendLine(`  ${toolStr}`);
      appendBlank();
    });
  },

  projects() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// projects')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();

    const projects = [
      {
        name: 'pi-hole-unbound-stack',
        status: 'active',
        desc: 'Fully recursive DNS resolver — Pi-Hole for blocking, Unbound for ' +

      {

        status: 'active',

              'Sandboxed Google Play not installed, kill-switch always on.',

      {
        name: 'vpn-stack',

        desc: 'Mullvad + IVPN — both independently audited, no personal data ' +

              'Neither provider has anything to identify you with.',
        tags: ['VPN', 'WireGuard', 'Mullvad', 'IVPN', 'Privacy'],

      {
        name: 'secure-comms-stack',

        desc: 'Zero-identifier communications: SimpleX Chat (no phone number, ' +

              'memory wiping) + SimpleLogin aliasing for email.',
        tags: ['SimpleX', 'Molly', 'SimpleLogin', 'OPSEC', 'Comms'],
      },
      {
        name: 'byte-cart.github.io',
        status: 'active',
        desc: 'This site. Static HTML, GPL-3.0, zero trackers, zero JS ' +
              'frameworks, zero external font requests.',
        tags: ['Web', 'Open-source', 'GPL-3.0'],
        url: 'https://github.com/Byte-Cart/Byte-Cart.github.io',
      },
    ];

    projects.forEach(p => {
      const statusColor = p.status === 'active' ? 'c-accent' : 'c-muted';
      const tags = p.tags.map(t => span('c-muted', `[${t}]`)).join(' ');
      appendLine(`  ${span('c-amber bold', p.name)}`);
      appendLine(`  ${span(statusColor, '●')} ${span('c-muted', p.status.toUpperCase())}  ${tags}`);
      appendLine(`  ${span('c-text', p.desc)}`);
      if (p.url) {
        appendLine(`  <a class="terminal-link" href="${p.url}" target="_blank" rel="noopener noreferrer">${p.url}</a>`);
      }
      appendBlank();
    });
  },

  stack() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// stack')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();

    const rows = [
      ['Desktop OS',    'Bazzite Atlas (gaming) · Tails (anonymous) · Win11 (compat)'],
      ['Mobile OS',     'GrapheneOS — hardened Android, no GMS, Pixel hardware'],
      ['DNS',           'Pi-Hole + Unbound — recursive, DNSSEC, LAN-only resolver'],
      ['VPN',           'Mullvad + IVPN — no accounts, cash/Monero, audited, WireGuard'],
      ['Browser',       'Brave (daily) · Mullvad Browser (fingerprint resistant) · Tor Browser (anonymous)'],
      ['Email',         'SimpleLogin — aliasing layer, real address never exposed'],
      ['Messaging',     'SimpleX Chat — no identifiers, no central relay · Signal/Molly — hardened Signal fork'],
      ['Password Mgr',  'KeePassXC (desktop) + KeePassDX (Android) — local, encrypted, open-source'],
      ['2FA / MFA',     'Ente Auth — E2EE TOTP, open-source, via Accrescent'],
      ['App Sourcing',  'Obtainium + GrapheneOS App Store + Accrescent — no Play Store dependency'],
      ['Encryption',    'VeraCrypt — full-volume and container encryption, cross-platform'],
      ['Search',        'SearXNG — self-hosted meta-search, zero query logging'],
      ['Maps',          'Organic Maps — offline, no telemetry, OSM-based'],
      ['Payments',      'Cash / Monero — no financial metadata trail'],
      ['Principle',     'Right tool. Right threat model. No exceptions.'],
    ];

    rows.forEach(([k, v]) => {
      appendLine(`  ${span('c-blue', k.padEnd(16))}${span('c-text', v)}`);
    });
    appendBlank();
  },

  privacy() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// why privacy matters')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();
    appendLine(`  ${span('c-amber bold', '"I have nothing to hide. Why should I care?"')}`);
    appendBlank();
    appendLine(`  ${span('c-text', 'This is the wrong question.')}`);
    appendBlank();
    appendLine(`  Much like the right to interracial marriage, women\'s suffrage,`);
    appendLine(`  and freedom of speech — our right to privacy hasn\'t always`);
    appendLine(`  been upheld. In several dictatorships today, it still isn\'t.`);
    appendLine(`  Generations before ours bled for these rights. Privacy is`);
    appendLine(`  one of them.`);
    appendBlank();
    appendLine(`  Privacy is a ${span('c-white bold', 'human right')} — inherent, universal, and owed`);
    appendLine(`  to every person without discrimination.`);
    appendBlank();
    appendLine(span('c-muted', '  ' + '·'.repeat(48)));
    appendBlank();
    appendLine(`  ${span('c-amber bold', 'Privacy is not secrecy.')}`);
    appendBlank();
    appendLine(`  We know what happens in the bathroom.`);
    appendLine(`  You still close the door.`);
    appendBlank();
    appendLine(`  Not because you\'re hiding something —`);
    appendLine(`  because some things are ${span('c-white bold', 'yours')}.`);
    appendBlank();
    appendLine(`  Everyone has something to protect. A relationship. A belief.`);
    appendLine(`  A medical condition. A draft thought. A private moment.`);
    appendLine(`  Privacy is what makes inner life possible. It\'s not a`);
    appendLine(`  feature. It\'s what makes us human.`);
    appendBlank();
    appendLine(span('c-muted', '  ' + '·'.repeat(48)));
    appendBlank();
    appendLine(`  ${span('c-muted', 'The goal of this stack is not paranoia.')}`);
    appendLine(`  ${span('c-muted', 'It\'s the quiet, principled exercise of a right')}`);
    appendLine(`  ${span('c-muted', 'that others fought to give us.')}`);
    appendBlank();
  },

  contact() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// contact')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();
    appendLine(`  ${span('c-muted', 'GitHub')}    <a class="terminal-link" href="https://github.com/Byte-Cart" target="_blank" rel="noopener noreferrer">@Byte-Cart</a>`);
    appendLine(`  ${span('c-muted', 'Email')}     <a class="terminal-link" href="mailto:undocked_knapsack905@simplelogin.com">undocked_knapsack905@simplelogin.com</a>`);
    appendLine(`  ${span('c-muted', 'SimpleX')}   <a class="terminal-link" href="https://smp18.simplex.im/a#iNFGWJ5ozjSFBmAqhOuhrqA7V7s95uEHjKIeMaTuKtk" target="_blank" rel="noopener noreferrer">Connect via SimpleX Chat</a>`);
    appendBlank();
    appendLine(`  ${span('c-muted', 'PGP / fingerprint available on request via SimpleX.')}`);
    appendBlank();
  },

  ls() {
    appendBlank();
    appendLine(`${span('c-accent', 'total 7')}`);
    const files = [
      ['-rw-r--r--', 'byte-cart', 'byte-cart',  '4096', 'README.md'],
      ['-rw-r--r--', 'byte-cart', 'byte-cart',  '2048', 'whoami.txt'],
      ['-rw-r--r--', 'byte-cart', 'byte-cart',  '1337', 'projects.txt'],
      ['-rw-r--r--', 'byte-cart', 'byte-cart',  '2048', 'skills.txt'],
      ['-rw-r--r--', 'byte-cart', 'byte-cart',  '1024', 'stack.txt'],
      ['-rw-r--r--', 'byte-cart', 'byte-cart',   '512', 'privacy.txt'],
      ['-rw-r--r--', 'byte-cart', 'byte-cart',   '256', 'contact.txt'],
    ];
    files.forEach(([perms, u, g, size, name]) => {
      const isDir = perms[0] === 'd';
      appendLine(
        `${span('c-muted', perms)} ${span('c-muted', `${u} ${g}`.padEnd(12))} ${span('c-muted', size.padStart(6))}  ${isDir ? span('c-blue bold', name) : span('c-text', name)}`
      );
    });
    appendBlank();
  },

  cat(args) {
    const file = (args[0] || '').toLowerCase();
    const map = {
      'readme.md':    'whoami',
      'whoami.txt':   'whoami',
      'projects.txt': 'projects',
      'skills.txt':   'skills',
      'stack.txt':    'stack',
      'privacy.txt':  'privacy',
      'contact.txt':  'contact',
    };
    if (map[file]) {
      CMDS[map[file]]();
    } else if (!file) {
      appendLine(span('c-err', 'Usage: cat <filename>'));
      appendLine(span('c-muted', 'Try: cat README.md'));
      appendBlank();
    } else {
      appendLine(span('c-err', `cat: ${file}: No such file or directory`));
      appendBlank();
    }
  },

  clear() {
    out.innerHTML = '';
    appendLine(`<span class="banner-sm">${BANNER_SM}</span>`);
    appendBlank();
    appendLine(`${span('c-muted','Type')} ${span('c-amber bold','help')} ${span('c-muted','to see available commands.')}`);
    appendBlank();
  },
};

// ─── Input handling ─────────────────────────────────────────────────

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const raw = inp.value.trim();
    if (!raw) return;

    cmdHistory.unshift(raw);
    if (cmdHistory.length > 50) cmdHistory.pop();
    histIdx = -1;

    echoCmd(raw);
    inp.value = '';

    const parts = raw.split(/\s+/);
    const cmd   = parts[0].toLowerCase();
    const args  = parts.slice(1);

    if (CMDS[cmd]) {
      CMDS[cmd](args);
    } else {
      appendLine(span('c-err', `bash: ${escHtml(cmd)}: command not found`));
      appendLine(span('c-muted', 'Type \'help\' to see available commands.'));
      appendBlank();
    }

    out.scrollTop = out.scrollHeight;
  }

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < cmdHistory.length - 1) histIdx++;
    inp.value = cmdHistory[histIdx] || '';
    setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length), 0);
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) histIdx--;
    else { histIdx = -1; inp.value = ''; return; }
    inp.value = cmdHistory[histIdx] || '';
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    const partial = inp.value.trim().toLowerCase();
    const matches = Object.keys(CMDS).filter(c => c.startsWith(partial));
    if (matches.length === 1) inp.value = matches[0];
    else if (matches.length > 1) {
      echoCmd(inp.value);
      appendLine(matches.map(m => span('c-accent', m)).join('  '));
      appendBlank();
    }
  }
});
</script>
