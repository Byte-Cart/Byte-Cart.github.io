<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>byte-cart — terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

    :root {
      --bg:       #080c0a;
      --surface:  #0e1410;
      --text:     #c8d8c2;
      --muted:    #4a6050;
      --accent:   #5a9e70;
      --blue:     #6b9bd1;
      --amber:    #c8a050;
      --dim:      #2a3a2e;
      --prompt:   #4ec87c;
      --err:      #c86060;
      --border:   #1e2e22;
      --scanline: rgba(0,0,0,0.18);
      --glow:     rgba(90,158,112,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.7;
      overflow: hidden;
    }

    /* CRT scanlines overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        var(--scanline) 2px,
        var(--scanline) 4px
      );
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* Phosphor vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 60%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 99;
    }

    #screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    /* Title bar */
    #titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #c84040; }
    .dot-y { background: #c8a040; }
    .dot-g { background: #40a860; }

    #titlebar-label {
      margin-left: auto;
      margin-right: auto;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    /* Output area */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--dim) transparent;
    }

    #output::-webkit-scrollbar { width: 4px; }
    #output::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    /* Input row */
    #input-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 8px 24px 20px;
      flex-shrink: 0;
    }

    #prompt-label {
      color: var(--prompt);
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 500;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      caret-color: var(--prompt);
      padding: 0 0 0 4px;
    }

    /* Output elements */
    .line { display: block; white-space: pre-wrap; word-break: break-word; }
    .line-cmd { color: var(--text); }
    .line-cmd .user-prompt { color: var(--prompt); }
    .line-blank { display: block; height: 1em; }

    .c-accent { color: var(--accent); }
    .c-blue   { color: var(--blue); }
    .c-amber  { color: var(--amber); }
    .c-muted  { color: var(--muted); }
    .c-err    { color: var(--err); }
    .c-dim    { color: var(--dim); }
    .c-white  { color: #e0e0e0; }
    .c-prompt { color: var(--prompt); }
    .bold     { font-weight: 700; }
    .italic   { font-style: italic; }

    /* ASCII art / banner */
    .banner {
      color: var(--accent);
      font-size: 12px;
      line-height: 1.3;
      letter-spacing: 0.02em;
      display: block;
      white-space: pre;
    }

    /* Section divider */
    .divider {
      display: block;
      color: var(--muted);
      margin: 2px 0;
    }

    /* Skill bar */
    .skill-row { display: flex; align-items: center; gap: 10px; margin: 1px 0; }
    .skill-name { color: var(--text); min-width: 200px; }
    .skill-bar-bg { background: var(--dim); height: 6px; border-radius: 3px; flex: 1; max-width: 160px; overflow: hidden; }
    .skill-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.8s ease; }
    .skill-pct { color: var(--muted); font-size: 12px; min-width: 32px; }

    /* Blink cursor for boot */
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .blink { animation: blink 1s step-start infinite; }

    /* Fade in */
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    .fadein { animation: fadein 0.12s ease forwards; }

    /* Glitch effect on banner */
    @keyframes glitch {
      0%,100%{clip-path:none;transform:none}
      92%{clip-path:polygon(0 30%,100% 30%,100% 32%,0 32%);transform:translateX(2px)}
      94%{clip-path:polygon(0 70%,100% 70%,100% 72%,0 72%);transform:translateX(-2px)}
      96%{clip-path:none;transform:translateX(1px)}
      98%{clip-path:none;transform:none}
    }
    .banner { animation: glitch 8s ease-in-out infinite; }

    a.terminal-link {
      color: var(--blue);
      text-decoration: none;
    }
    a.terminal-link:hover { text-decoration: underline; color: #8fbaec; }
  </style>
</head>
<body>

<div id="screen">
  <div id="titlebar">
    <div class="dot dot-r"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-g"></div>
    <span id="titlebar-label">byte-cart@localhost — bash — 80×24</span>
  </div>

  <div id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>

  <div id="input-row">
    <span id="prompt-label">byte-cart@localhost:~$&nbsp;</span>
    <input id="input" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
           aria-label="Terminal input" placeholder="type 'help' to begin…">
  </div>
</div>

<script>
const out = document.getElementById('output');
const inp = document.getElementById('input');

// Focus input on click anywhere
document.addEventListener('click', () => inp.focus());

// Command history
let history = [], histIdx = -1;

// ─── Output helpers ────────────────────────────────────────────────

function span(cls, text) {
  return `<span class="${cls}">${text}</span>`;
}

function appendLine(html = '', extraClass = '') {
  const el = document.createElement('span');
  el.className = `line fadein ${extraClass}`.trim();
  el.innerHTML = html;
  out.appendChild(el);
  out.scrollTop = out.scrollHeight;
}

function appendBlank() {
  const el = document.createElement('span');
  el.className = 'line-blank';
  out.appendChild(el);
}

function echoCmd(cmd) {
  const p = `<span class="c-prompt bold">byte-cart@localhost:~$</span> <span class="c-white">${escHtml(cmd)}</span>`;
  appendLine(p, 'line-cmd');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Boot sequence ─────────────────────────────────────────────────

const BOOT = [
  [0,   () => appendLine(`<span class="c-muted">BIOS v2.1.0 — initialising…</span>`)],
  [300, () => appendLine(`<span class="c-muted">Loading kernel…              <span class="c-accent">OK</span></span>`)],
  [600, () => appendLine(`<span class="c-muted">Mounting filesystems…        <span class="c-accent">OK</span></span>`)],
  [900, () => appendLine(`<span class="c-muted">Enabling firewall rules…     <span class="c-accent">OK</span></span>`)],
  [1200,() => appendLine(`<span class="c-muted">Starting DNS resolver…       <span class="c-accent">OK</span></span>`)],
  [1500,() => appendLine(`<span class="c-muted">Verifying integrity…         <span class="c-accent">OK</span></span>`)],
  [1900,() => appendBlank()],
  [2000,() => appendLine(`<span class="banner">${BANNER}</span>`)],
  [2100,() => appendBlank()],
  [2200,() => appendLine(`${span('c-muted','Last login:')} ${span('c-accent', new Date().toDateString())} via tty0`)],
  [2300,() => appendLine(`${span('c-muted','Type')} ${span('c-amber bold','help')} ${span('c-muted','to see available commands.')}`)],
  [2400,() => appendBlank()],
  [2500,() => { inp.disabled = false; inp.focus(); }],
];

const BANNER = `
 ██████╗ ██╗   ██╗████████╗███████╗      ██████╗ █████╗ ██████╗ ████████╗
 ██╔══██╗╚██╗ ██╔╝╚══██╔══╝██╔════╝     ██╔════╝██╔══██╗██╔══██╗╚══██╔══╝
 ██████╔╝ ╚████╔╝    ██║   █████╗       ██║     ███████║██████╔╝   ██║   
 ██╔══██╗  ╚██╔╝     ██║   ██╔══╝       ██║     ██╔══██║██╔══██╗   ██║   
 ██████╔╝   ██║      ██║   ███████╗     ╚██████╗██║  ██║██║  ██║   ██║   
 ╚═════╝    ╚═╝      ╚═╝   ╚══════╝      ╚═════╝╚═╝  ╚═╝╚═╝  ╚═╝   ╚═╝  `.trim();

inp.disabled = true;
BOOT.forEach(([t, fn]) => setTimeout(fn, t));

// ─── Command definitions ────────────────────────────────────────────

const CMDS = {

  help() {
    appendBlank();
    appendLine(`${span('c-amber bold','Available commands:')}`);
    appendBlank();
    const cmds = [
      ['whoami',    'Identity and background'],
      ['skills',    'Technical skill set'],
      ['projects',  'Current and past projects'],
      ['stack',     'Hardware & OS setup'],
      ['contact',   'Ways to reach me'],
      ['clear',     'Clear terminal output'],
      ['ls',        'List available files'],
      ['cat',       'Read a file (e.g. cat README.md)'],
    ];
    cmds.forEach(([c, d]) => {
      appendLine(`  ${span('c-accent bold', c.padEnd(14))}${span('c-muted', d)}`);
    });
    appendBlank();
  },

  whoami() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// whoami')}`);
    appendLine(`${span('c-muted', '─'.repeat(52))}`);
    appendLine(`  Handle    ${span('c-white', 'byte-cart')}`);
    appendLine(`  Role      ${span('c-white', 'Product Support Engineer — Cybersecurity Infra')}`);
    appendLine(`  Employer  ${span('c-blue', 'Proofpoint')}`);
    appendLine(`  Focus     ${span('c-white', 'Privacy-first infrastructure & threat analysis')}`);
    appendLine(`  Location  ${span('c-muted', '[REDACTED]')}`);
    appendBlank();
    appendLine(`  ${span('c-muted', '"Minimal footprint. Maximum control."')}`);
    appendBlank();
  },

  skills() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// skills')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();

    const skills = [
      ['Email Security (Proofpoint)', 92],
      ['DNS / Pi-Hole / Unbound',     88],
      ['Linux Administration',         85],
      ['Network Threat Analysis',      82],
      ['GrapheneOS / Mobile OPSEC',    80],
      ['Firewall & Packet Filtering',  75],
      ['Scripting (Bash / Python)',     70],
      ['Log Analysis & SIEM',          68],
    ];

    skills.forEach(([name, pct]) => {
      const fill = Math.round((pct / 100) * 160);
      appendLine(`  <span class="skill-row">` +
        `<span class="skill-name c-text">${name}</span>` +
        `<span class="skill-bar-bg"><span class="skill-bar-fill" style="width:${fill}px"></span></span>` +
        `<span class="skill-pct c-muted">${pct}%</span>` +
        `</span>`);
    });
    appendBlank();
    appendLine(`  ${span('c-muted', 'Certs:')} ${span('c-white', 'In progress — always learning.')}`);
    appendBlank();
  },

  projects() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// projects')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();

    const projects = [
      {
        name: 'pi-hole-unbound-stack',
        status: 'active',
        desc: 'Recursive DNS resolver with Pi-Hole, Unbound, and DNSSEC on-prem.',
        tags: ['DNS', 'Privacy', 'Self-hosted'],
      },
      {
        name: 'grapheneos-hardening',
        status: 'active',
        desc: 'Personal GrapheneOS profile — sandboxing, network kill-switch, no GMS.',
        tags: ['Mobile', 'OPSEC', 'GrapheneOS'],
      },
      {
        name: 'byte-cart.github.io',
        status: 'active',
        desc: 'This site — static, GPL-3.0, zero trackers, no JS frameworks.',
        tags: ['Web', 'Open-source'],
        url: 'https://github.com/Byte-Cart/Byte-Cart.github.io',
      },
      {
        name: 'email-threat-analysis',
        status: 'private',
        desc: 'Internal tooling for header analysis and phishing classification.',
        tags: ['Proofpoint', 'Security', 'Python'],
      },
    ];

    projects.forEach(p => {
      const statusColor = p.status === 'active' ? 'c-accent' : 'c-muted';
      const tags = p.tags.map(t => span('c-muted', `[${t}]`)).join(' ');
      appendLine(`  ${span('c-amber bold', p.name)}`);
      appendLine(`  ${span(statusColor, '●')} ${span('c-muted', p.status.toUpperCase())}  ${tags}`);
      appendLine(`  ${span('c-text', p.desc)}`);
      if (p.url) {
        appendLine(`  <a class="terminal-link" href="${p.url}" target="_blank" rel="noopener noreferrer">${p.url}</a>`);
      }
      appendBlank();
    });
  },

  stack() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// stack')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();

    const rows = [
      ['Desktop OS',   'Bazzite (Atlas) — immutable Fedora-based gaming/work'],
      ['Mobile OS',    'GrapheneOS — hardened Android on Pixel'],
      ['DNS',          'Pi-Hole + Unbound (recursive, DNSSEC, local-only)'],
      ['Browser',      'Hardened Firefox / Tor Browser'],
      ['Email',        'SimpleLogin aliases — no real address exposed'],
      ['Messaging',    'SimpleX Chat — no phone number, no central server'],
      ['Threat Intel', 'Proofpoint TAP — email security & click-time protect'],
      ['VPN',          'Wireguard (self-hosted)'],
      ['Password Mgr', 'Bitwarden (self-hosted)'],
    ];

    rows.forEach(([k, v]) => {
      appendLine(`  ${span('c-blue', k.padEnd(16))}${span('c-text', v)}`);
    });
    appendBlank();
  },

  contact() {
    appendBlank();
    appendLine(`${span('c-accent bold', '// contact')}`);
    appendLine(span('c-muted', '─'.repeat(52)));
    appendBlank();
    appendLine(`  ${span('c-muted', 'GitHub')}    <a class="terminal-link" href="https://github.com/Byte-Cart" target="_blank" rel="noopener noreferrer">@Byte-Cart</a>`);
    appendLine(`  ${span('c-muted', 'Email')}     <a class="terminal-link" href="mailto:thesis_embroider466@simplelogin.com">thesis_embroider466@simplelogin.com</a>`);
    appendLine(`  ${span('c-muted', 'SimpleX')}   <a class="terminal-link" href="https://smp15.simplex.im/a#UglaDVH3cuZ9XeqHIkDf1Y_t4kcJzXhMiJYekBvVz6s" target="_blank" rel="noopener noreferrer">Connect via SimpleX Chat</a>`);
    appendBlank();
    appendLine(`  ${span('c-muted', 'PGP / fingerprint available on request via SimpleX.')}`);
    appendBlank();
  },

  ls() {
    appendBlank();
    appendLine(`${span('c-accent', 'total 6')}`);
    const files = [
      ['-rw-r--r--', 'root', 'root',  '4096', 'README.md'],
      ['-rw-r--r--', 'root', 'root',  '2048', 'whoami.txt'],
      ['-rw-r--r--', 'root', 'root',  '1337', 'projects.txt'],
      ['-rw-r--r--', 'root', 'root',   '512', 'contact.txt'],
      ['drwxr-xr-x', 'root', 'root',  '4096', 'skills/'],
      ['drwxr-xr-x', 'root', 'root',  '4096', 'stack/'],
    ];
    files.forEach(([perms, u, g, size, name]) => {
      const isDir = perms[0] === 'd';
      appendLine(
        `${span('c-muted', perms)} ${span('c-muted', `${u} ${g}`.padEnd(12))} ${span('c-muted', size.padStart(6))}  ${isDir ? span('c-blue bold', name) : span('c-text', name)}`
      );
    });
    appendBlank();
  },

  cat(args) {
    const file = (args[0] || '').toLowerCase();
    const map = {
      'readme.md':    'whoami',
      'whoami.txt':   'whoami',
      'projects.txt': 'projects',
      'contact.txt':  'contact',
    };
    if (map[file]) {
      CMDS[map[file]]();
    } else if (!file) {
      appendLine(span('c-err', 'Usage: cat <filename>'));
      appendLine(span('c-muted', 'Try: cat README.md'));
      appendBlank();
    } else {
      appendLine(span('c-err', `cat: ${file}: No such file or directory`));
      appendBlank();
    }
  },

  clear() {
    out.innerHTML = '';
  },
};

// ─── Input handling ─────────────────────────────────────────────────

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const raw = inp.value.trim();
    if (!raw) return;

    history.unshift(raw);
    if (history.length > 50) history.pop();
    histIdx = -1;

    echoCmd(raw);
    inp.value = '';

    const parts = raw.split(/\s+/);
    const cmd   = parts[0].toLowerCase();
    const args  = parts.slice(1);

    if (CMDS[cmd]) {
      CMDS[cmd](args);
    } else {
      appendLine(span('c-err', `bash: ${escHtml(cmd)}: command not found`));
      appendLine(span('c-muted', 'Type \'help\' to see available commands.'));
      appendBlank();
    }

    out.scrollTop = out.scrollHeight;
  }

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) histIdx++;
    inp.value = history[histIdx] || '';
    setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length), 0);
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) histIdx--;
    else { histIdx = -1; inp.value = ''; return; }
    inp.value = history[histIdx] || '';
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    const partial = inp.value.trim().toLowerCase();
    const matches = Object.keys(CMDS).filter(c => c.startsWith(partial));
    if (matches.length === 1) inp.value = matches[0];
    else if (matches.length > 1) {
      echoCmd(inp.value);
      appendLine(matches.map(m => span('c-accent', m)).join('  '));
      appendBlank();
    }
  }
});
</script>
</body>
</html>
